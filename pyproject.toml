[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dealfeed"
version = "0.1.0"
description = "Off-market small-business deal feed: data pipeline, REST API and MCP server"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=2.0",
    "polars>=1.0",
    "rapidfuzz>=3.9",
    "usaddress>=0.5",
    "httpx>=0.27",
]

[project.optional-dependencies]
llm = ["anthropic>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
dealfeed = "dealfeed.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
